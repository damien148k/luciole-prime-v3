# =============================================================================
# PROFIL AGENTIQUE : GENERIC (défaut)
# =============================================================================
# Profil neutre, sans restriction métier particulière. Sert de base pour
# tout déploiement qui n'a pas encore de profil dédié, et de référence pour
# créer un nouveau profil métier (copier ce fichier, ajuster tools_allowed,
# default_metadata_filters, system_prompt et stop_conditions).
# =============================================================================

name: generic

# Nombre maximum d'itérations de la boucle plan -> act -> observe avant
# arrêt forcé (voir orchestrator.py). 5 est un bon compromis latence/qualité
# pour des questions documentaires simples à modérément complexes.
max_steps: 5

# Tools autorisés pour ce profil (voir tools.py pour la liste complète
# disponible dans le registre). final_answer est toujours implicitement
# disponible même s'il est omis ici (garde-fou de l'orchestrateur).
tools_allowed:
  - search_documents
  - search_multi
  - get_document
  - final_answer

# Filtres de métadonnées appliqués par défaut à toutes les recherches de ce
# profil (voir METADATA_FILTERABLE_FIELDS dans ingestion/pipeline.py pour
# la liste des champs disponibles : client, editor, technology, product,
# version, support_type, severity, ticket_id, projet, phase, thematique,
# departement). Vide = aucune restriction par défaut.
default_metadata_filters: {}

# Prompt système du planificateur agentique (pas le prompt de génération
# finale, qui reste géré par generation/llm.py et config/prompts.yaml).
system_prompt: |
  Tu es Luciole, un assistant documentaire d'entreprise. Utilise les outils
  de recherche disponibles pour rassembler des informations avant de
  répondre. Ne jamais inventer de données. Cite systématiquement tes
  sources. Si tu ne trouves pas d'information pertinente après plusieurs
  recherches, dis-le clairement plutôt que de spéculer.

# Conditions vérifiées avant d'accepter une réponse finale (final_answer).
# Si elles ne sont pas respectées, l'orchestrateur redonne une chance au
# LLM de chercher davantage plutôt que de renvoyer une réponse non sourcée.
stop_conditions:
  min_sources: 1
  require_citation: true

# Règles de routage optionnelles, informatives pour l'instant (non
# exécutées automatiquement par l'orchestrateur v1 — voir README.md de ce
# dossier pour l'évolution prévue). Laissé vide pour le profil générique.
routing_rules: []
