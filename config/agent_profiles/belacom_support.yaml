# =============================================================================
# PROFIL AGENTIQUE : BELACOM_SUPPORT
# =============================================================================
# Profil pour l'instance support Belacom (tickets Freshdesk anonymisés +
# fiches connaissance, frontmatter YAML unifié : client, editor, technology,
# product, version, support_type, severity, ticket_id — voir la PR "fix
# ingestion YAML front matter" mergée sur main).
#
# Différences vs generic.yaml :
# - escalate_to_human autorisé (tickets sensibles / sévérité critique)
# - system_prompt orienté support technique, exige la citation du ticket_id
# - stop_conditions : 1 source minimum (citation obligatoire). Un ticket
#   support correspond en général à un seul incident documenté : exiger
#   2 sources forçait le LLM à répéter final_answer jusqu'à max_steps
#   quand une seule source pertinente existait réellement (observé en
#   test réel sur l'instance Belacom le 2026-07-31, ticket BLM-2025-0314).
# =============================================================================

name: belacom_support

max_steps: 5

tools_allowed:
  - search_documents
  - search_multi
  - get_document
  - escalate_to_human
  - final_answer

# Aucun filtre forcé par défaut : l'index belacom est dédié à ce client,
# donc pas besoin de filtrer par "client" ici. À ajuster si l'instance
# devient multi-client un jour (ex: {"client": "belacom"}).
default_metadata_filters: {}

system_prompt: |
  Tu es l'agent support technique de Belacom. Tu réponds aux questions à
  partir des tickets résolus et des fiches de connaissance déjà indexés
  (front matter: client, editor, technology, product, version,
  support_type, severity, ticket_id).

  Règles :
  - Utilise search_documents avec des filtres sur editor/technology/severity
    quand la question mentionne un équipement ou un niveau de gravité précis
    (ex: {"editor": "fortinet"}, {"severity": "high"}).
  - Cite toujours le ticket_id des sources utilisées dans ta réponse finale.
  - Si la question évoque une panne critique en production, ou si tu ne
    trouves aucune source pertinente après recherche, appelle
    escalate_to_human avec un motif clair plutôt que de répondre au hasard.
  - Si un premier essai de final_answer est refusé faute de source ou de
    citation, ne répète jamais le même texte : relance search_documents
    avec une requête reformulée ou search_multi avant de retenter.
  - Ne jamais inventer de procédure ou de référence matérielle absente des
    documents retrouvés.

stop_conditions:
  min_sources: 1
  require_citation: true

# Règle de routage informative (non exécutée automatiquement par
# l'orchestrateur v1) : sert de documentation pour une future version qui
# inspecterait les métadonnées retrouvées avant même d'appeler le LLM
# planificateur, pour forcer l'escalade sans dépendre du jugement du modèle.
routing_rules:
  - condition: "metadata.severity == 'critical'"
    action: escalate_to_human
    note: >
      Escalade automatique prévue pour une v2 du routage : pour l'instant,
      la sévérité critique est gérée via une instruction dans le
      system_prompt, le LLM planificateur décide donc lui-même d'escalader.
